services:

  # ==================================================
  # 1. KAFKA - INGESTION DES EVENEMENTS
  # ==================================================
  kafka:
    image: confluentinc/cp-kafka:8.1.0
    container_name: firewatch-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - firewatch-net

    healthcheck:
      test:
        - CMD
        - kafka-topics
        - --bootstrap-server
        - kafka:29092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ==================================================
  # 2. HDFS - NAMENODE
  # ==================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: firewatch-namenode
    hostname: namenode
    restart: unless-stopped

    ports:
      - "9870:9870"
      - "9000:9000"

    environment:
      CLUSTER_NAME: firewatch

    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./configs/hadoop/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./configs/hadoop/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro

    networks:
      - firewatch-net


  # ==================================================
  # 3. HDFS - DATANODE 1
  # ==================================================
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: firewatch-datanode1
    hostname: datanode1
    restart: unless-stopped

    depends_on:
      - namenode

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    ports:
      - "9864:9864"

    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
      - ./configs/hadoop/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./configs/hadoop/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro

    networks:
      - firewatch-net


  # ==================================================
  # 4. HDFS - DATANODE 2
  # ==================================================
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: firewatch-datanode2
    hostname: datanode2
    restart: unless-stopped

    depends_on:
      - namenode

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    ports:
      - "9865:9864"

    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
      - ./configs/hadoop/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./configs/hadoop/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro

    networks:
      - firewatch-net


  # ==================================================
  # 5. SPARK - MASTER
  # ==================================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: firewatch-spark-master
    hostname: spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./configs/hadoop:/opt/hadoop-conf:ro

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf

    networks:
      - firewatch-net


  # ==================================================
  # 6. SPARK - WORKER 1
  # ==================================================
  spark-worker1:
    image: apache/spark:3.5.6
    container_name: firewatch-spark-worker1
    hostname: spark-worker1
    restart: unless-stopped

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "1G"

    ports:
      - "8081:8081"

    volumes:
      - ./configs/hadoop:/opt/hadoop-conf:ro

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf

    networks:
      - firewatch-net


  # ==================================================
  # 7. SPARK - WORKER 2
  # ==================================================
  spark-worker2:
    image: apache/spark:3.5.6
    container_name: firewatch-spark-worker2
    hostname: spark-worker2
    restart: unless-stopped

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "1G"

    ports:
      - "8082:8081"

    volumes:
      - ./configs/hadoop:/opt/hadoop-conf:ro

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf

    networks:
      - firewatch-net


# ==================================================
# VOLUMES - STOCKAGE PERSISTANT
# ==================================================
volumes:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:


# ==================================================
# RESEAU COMMUN
# ==================================================
networks:
  firewatch-net:
    driver: bridge